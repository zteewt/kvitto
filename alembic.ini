# Конфигурация Alembic.
# URL берётся из переменной DATABASE_URL; значение ниже — запасное.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Запасной URL: его переопределяет DATABASE_URL (см. migrations/env.py)
# либо вызывающий код (kvitto/infrastructure/db/schema.py).
sqlalchemy.url = sqlite:///./kvitto.db

[post_write_hooks]
# Новые миграции сразу приводятся к стилю проекта.
hooks = ruff_format, ruff_check
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S