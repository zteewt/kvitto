name: CI

on:
  push:
    # Ветка в репозитории называется master; main тоже принимается,
    # чтобы переименование ветки не выключало проверки молча.
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -v